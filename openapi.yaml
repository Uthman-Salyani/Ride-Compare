openapi: 3.0.0
info:
  title: RideCompare API
  version: 1.0.0
  description: >
    Read-only API surface exposed to Voter Edu. All endpoints are GET.
    RideCompare's own product also has internal write endpoints
    (e.g. POST /bookings) used when a rider books directly through
    RideCompare's app, but those are not exposed to this partner since
    Voter Edu never books through us — see ENDPOINT_LIST.md Part D.
servers:
  - url: http://localhost:3001
    description: Local development server (replace with a URL your partner can reach when exchanging contracts)
paths:
  /landmarks:
    get:
      summary: Return the list of Nairobi landmarks (name + location)
      responses:
        '200':
          description: A list of Nairobi landmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Landmark'
              example:
                - id: "1"
                  name: "westlands"
                  location:
                    lat: -1.2676
                    lng: 36.8123
                - id: "2"
                  name: "cbd"
                  location:
                    lat: -1.2833
                    lng: 36.8172

  /landmarks/{id}:
    get:
      summary: Return details for a single landmark
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the landmark, as returned by GET /landmarks
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: The requested landmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landmark'
              example:
                id: "1"
                name: "westlands"
                location:
                  lat: -1.2676
                  lng: 36.8123
        '404':
          description: No landmark exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "No landmark found with id '9999'"

  /providers:
    get:
      summary: Return the list of ride providers included in comparisons
      responses:
        '200':
          description: A list of ride providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
              example:
                - id: "little"
                  name: "Little"
                  logoUrl: "https://cdn.ridecompare.co.ke/logos/little.png"
                - id: "bolt"
                  name: "Bolt"
                  logoUrl: "https://cdn.ridecompare.co.ke/logos/bolt.png"

  /rides:
    get:
      summary: >
        Return fare/ETA estimates across providers and ride types,
        filterable by ride type, sortable by ETA or fare
      description: >
        pickup and dropoff coordinates are required and validated, but
        fare.amount is currently each ride type's base fare only; it does
        not vary with distance or travel time.
      parameters:
        - name: pickup_lat
          in: query
          required: true
          schema:
            type: number
            format: float
            example: -1.2864
        - name: pickup_lng
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 36.8172
        - name: dropoff_lat
          in: query
          required: true
          schema:
            type: number
            format: float
            example: -1.3197
        - name: dropoff_lng
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 36.8271
        - name: type
          in: query
          required: false
          description: Filter results to a single ride type (case-insensitive). Any other value returns 400.
          schema:
            type: string
            enum: [Boda, Standard, XL, Comfort, Delivery]
            example: "Standard"
        - name: sort
          in: query
          required: false
          description: Sort field for the returned estimates, ascending. Any other value returns 400.
          schema:
            type: string
            enum: [eta, fare]
            example: "eta"
      responses:
        '200':
          description: A list of ride estimates matching the query (empty array if none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RideEstimate'
              example:
                - id: "uber-x"
                  providerId: "uber"
                  providerName: "Uber"
                  rideType: "Standard"
                  fare:
                    currency: "KES"
                    amount: 120.0
                  etaMinutes: 5
                  capacity: 4
                - id: "bolt-boda"
                  providerId: "bolt"
                  providerName: "Bolt"
                  rideType: "Boda"
                  fare:
                    currency: "KES"
                    amount: 41.0
                  etaMinutes: 3
                  capacity: 1
        '400':
          description: >
            Missing or invalid query parameters (non-numeric coordinates, or a
            type or sort value outside the allowed list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_PARAMETER"
                message: "'pickup_lat', 'pickup_lng', 'dropoff_lat', and 'dropoff_lng' must be valid floats"

  /rides/{id}:
    get:
      summary: Return a single ride estimate's detail (fare, ETA, capacity, provider)
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the ride estimate, as returned by GET /rides
          schema:
            type: string
            example: "uber-x"
      responses:
        '200':
          description: The requested ride estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEstimate'
              example:
                id: "uber-x"
                providerId: "uber"
                providerName: "Uber"
                rideType: "Standard"
                fare:
                  currency: "KES"
                  amount: 120.0
                etaMinutes: 5
                capacity: 4
        '404':
          description: No ride estimate exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NOT_FOUND"
                message: "No ride estimate found with id 'nonexistent-id'"

components:
  schemas:
    Location:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: float
          example: -1.2676
        lng:
          type: number
          format: float
          example: 36.8123

    Landmark:
      type: object
      required: [id, name, location]
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "westlands"
        location:
          $ref: '#/components/schemas/Location'

    Provider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: "little"
        name:
          type: string
          example: "Little"
        logoUrl:
          type: string
          format: uri
          example: "https://cdn.ridecompare.co.ke/logos/little.png"

    FareEstimate:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
          example: "KES"
        amount:
          type: number
          format: float
          description: Base fare for the ride type. Not adjusted for distance or travel time.
          example: 120.0

    RideEstimate:
      type: object
      required:
        - id
        - providerId
        - providerName
        - rideType
        - fare
        - etaMinutes
        - capacity
      properties:
        id:
          type: string
          example: "uber-x"
        providerId:
          type: string
          example: "uber"
        providerName:
          type: string
          example: "Uber"
        rideType:
          type: string
          enum: [Boda, Standard, XL, Comfort, Delivery]
          example: "Standard"
        fare:
          $ref: '#/components/schemas/FareEstimate'
        etaMinutes:
          type: integer
          example: 5
        capacity:
          type: integer
          description: Number of passenger seats (0 for delivery services)
          example: 4

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "No ride estimate found with id 'nonexistent-id'"
